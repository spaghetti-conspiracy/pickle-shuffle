<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習会を選ぶ — ピックルボール対戦カード</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="admin">
  <h1>ピックルボール対戦カード生成</h1>

  <section>
    <h2>練習会の選択・新規作成</h2>
    <div id="pick" class="row">
      <select id="session-select" aria-label="練習会を選ぶ"></select>
      <button id="open-session" class="primary">開く</button>
    </div>
    <div class="row" style="margin-top:0.75rem">
      <input id="new-session-name" placeholder="新しい練習会の名前" size="20">
      <input id="new-session-event" placeholder="tennisbear のイベントID（任意）" size="24"
             inputmode="numeric">
      <label>コート数
        <select id="new-session-courts">
          <option>1</option><option selected>2</option><option>3</option><option>4</option>
        </select>
      </label>
      <button id="create-session" class="primary">作成</button>
    </div>
    <p id="error" class="error"></p>
    <p class="notice">
      イベントID を入れると参加者を取り込みます。イベントページの URL
      <code>…/event/1614380/info</code> の数字の部分です。
      性別とレベルは推定なので、取り込んだあと管理画面で直せます。
    </p>
    <p class="notice">コート数は作成時に決めます。あとから個々のコートを試合用から外せます。</p>
  </section>
</div>
<script type="module" src="/select.js"></script>
</body>
</html>
