<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全体表示 — Pickle Shuffle</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="gone" class="gone hidden">
  <p>この練習会は終了しています</p>
  <p class="notice"><a href="/">練習会を選び直す</a></p>
</div>

<div id="overview" class="overview">
  <div class="overview-head">
    <h1 id="session-name"></h1>
    <span id="warnings" class="warnings"></span>
    <span id="offline" class="error hidden"></span>
    <a id="admin-link" href="/">メンバー登録へ</a>
  </div>

  <div class="overview-body">
    <div class="court-column">
      <div id="courts" class="court-list"></div>
      <section id="clock-box" class="clock-box hidden">
        <h2 id="clock-title" class="clock-title">残り時間</h2>
        <div id="clock" class="clock"></div>
      </section>
    </div>

    <div class="side">
      <section class="qr">
        <h2>メンバー用画面</h2>
        <img id="qr" class="hidden" alt="メンバー用画面のQRコード">
        <p class="hint">スマートフォンで読み取ると、自分のコートを見られます</p>
        <p id="member-url" class="url"></p>
        <p id="qr-warning" class="notice warn hidden">
          この端末だけで通じるアドレスです。スマートフォンから使うには、
          この画面を <b>PC の LAN の IP</b> で開き直してください。
          （例: http://192.168.1.10:8000/）
        </p>
      </section>
      <section>
        <h2>名前の色</h2>
        <p id="legend" class="legend"></p>
      </section>
      <section>
        <h2>待機中</h2>
        <p id="waiting" class="muted">—</p>
      </section>
      <section>
        <h2>休憩中</h2>
        <p id="resting" class="muted">—</p>
      </section>
    </div>
  </div>
</div>

<div id="action-bar" class="action-bar">
  <button id="alarm-off" class="danger hidden">アラームオフ</button>
  <button id="pause" class="hidden">一時停止</button>
  <button id="stop-timer" class="hidden">中断</button>
  <button id="start" class="primary">開始</button>
  <button id="next">次のマッチ</button>
</div>

<script type="module" src="/overview.js"></script>
</body>
</html>
