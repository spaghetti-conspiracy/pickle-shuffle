[project]
name = "pickle-shuffle"
version = "0.1.0"
description = "ピックルボール練習会の対戦カード生成アプリ"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "segno>=1.6",
]

[project.optional-dependencies]
# 別の DB に差し替えるとき: pip install -e ".[postgres]"
postgres = ["psycopg[binary]>=3.1"]

# 開発用は extras ではなく依存グループに置く。extras だと `uv sync` が
# 既定で入れないので、CLAUDE.md の手順どおりに進めてもテストが動かない。
[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",
    "ruff>=0.4",
    # ブラウザテスト用。**dev に入れておく。** 入っていないと
    # `pytest -m browser` が「0件実行で緑」になり、release の前提が空振りする。
    "playwright>=1.44",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# リポジトリのルートを import できるようにする。テスト同士が
# `from tests.test_api import ...` で助け合っているため。
# `python -m pytest` では CWD が入るので気づけない（`pytest` では入らない）。
pythonpath = ["."]
# ブラウザテストは既定で外す。Playwright を入れていない手元でも、
# ユニットテストはそのまま通る。走らせるときは `pytest -m browser`。
addopts = "-q -m 'not browser'"
markers = ["browser: 実際のブラウザで画面を操作する（Playwright が要る）"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
