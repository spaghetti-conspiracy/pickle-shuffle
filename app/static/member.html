<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コート表示 — Pickle Shuffle</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="gone" class="gone hidden">
  <p>この練習会は終了しています</p>
  <p class="notice">
    新しい練習会が始まっていたら、会場に出ている QR コードを読み取ってください。
  </p>
</div>

<div id="member" class="member">
  <div class="member-head">
    <h1 id="session-name"></h1>
    <span id="status" class="status"></span>
    <span id="offline" class="error hidden"></span>

  </div>

  <div id="tabs" class="tabs" role="tablist"></div>

  <div id="court" class="member-court"></div>

  <section id="clock-box" class="clock-box hidden">
    <h2 id="clock-title" class="clock-title">残り時間</h2>
    <div id="clock" class="clock"></div>
    <button id="alarm-off" class="danger hidden">アラームを止める</button>
  </section>

  <div class="member-foot">
    <span id="waiting"></span>
    <label class="member-sound">
      <input type="checkbox" id="sound-on" checked>
      時間切れに音を鳴らす
    </label>
  </div>
</div>
<script type="module" src="/member.js"></script>
</body>
</html>
