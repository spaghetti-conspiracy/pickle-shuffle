<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>練習会の管理 — Pickle Shuffle</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="admin">
  <section>
    <div class="row">
      <h1 id="session-name"></h1>
      <button id="open-overview" class="primary">全体画面を開く</button>
      <button id="finish-session" class="danger">この練習会を終了する</button>
    </div>
    <label class="row" style="margin-top:0.5rem">
      1試合の持ち時間
      <select id="timer-minutes">
        <option value="unlimited">無制限</option>
      </select>
    </label>
    <label class="row" style="margin-top:0.5rem">
      <input type="checkbox" id="highlight-beginners">
      初心者を緑で表示する（全体画面だけ。アルゴリズムの確認用で、ふだんは off）
    </label>
    <p class="notice"><a href="/">別の練習会を選ぶ</a></p>
  </section>

  <section id="courts-section">
    <h2>コート</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>名前</th><th>状態</th><th>操作</th></tr></thead>
        <tbody id="courts-body"></tbody>
      </table>
    </div>
    <p class="notice">初心者の育成などで1面を練習に使うときは「練習コート」にします。</p>
  </section>

  <section id="members-section">
    <h2>メンバー</h2>
    <div class="row">
      <select id="pick-person" aria-label="名簿から選ぶ"></select>
      <button id="add-known" class="primary">参加者にする</button>
    </div>
    <p id="pick-note" class="notice"></p>
    <p class="notice">
      名簿にいない人は、下の欄で登録できます（名簿にも入ります）。
      名簿の手入れは <a href="/members.html">メンバーの管理</a> から。
    </p>
    <div class="row" style="margin-top:0.5rem">
      <input id="new-nickname" placeholder="ニックネーム" size="14">
      <select id="new-gender">
        <option value="male">男性</option>
        <option value="female">女性</option>
        <option value="other">未設定</option>
      </select>
      <select id="new-level">
        <option value="pickleball">ピックルボール経験者</option>
        <option value="racket_experienced">ラケット経験者（ルール習得中）</option>
        <option value="beginner">未経験者</option>
      </select>
      <button id="add-member" class="primary">追加</button>
    </div>
    <div class="row" style="margin-top:0.5rem">
      <input id="import-event" placeholder="tennisbear のイベントID" size="22"
             inputmode="numeric">
      <button id="import-members">参加者を取り込む</button>
    </div>
    <p id="import-note" class="notice"></p>
    <p id="import-result" class="notice"></p>
    <p id="member-error" class="error"></p>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>ニックネーム</th><th>性別</th><th>レベル</th><th>試合数</th><th>操作</th></tr>
        </thead>
        <tbody id="members-body"></tbody>
      </table>
    </div>
    <p id="duplicate-notice" class="notice warn hidden"></p>
    <p class="notice">
      練習コートに移るなど、試合から外れるメンバーは「休憩」にしてください。
    </p>
  </section>

</div>
<script type="module" src="/manage.js"></script>
</body>
</html>
