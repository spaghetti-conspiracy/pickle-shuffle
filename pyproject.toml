[project]
name = "pickle-shuffle"
version = "0.1.0"
description = "ピックルボール練習会の対戦カード生成アプリ"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# 別の DB に差し替えるとき: pip install -e ".[postgres]"
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
