# release を打ったら本番へ出す。
#
# **そのコミットの CI が all green であることを先に確かめる。**
# release は手で打つものなので、うっかり赤いコミットに打ててしまう。
name: Release

on:
  release:
    types: [published]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: CI が通っているか確かめる
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # CI の実行結果を読むために要る。既定が制限モードの組織では
      # これが無いと 403 で guard が落ちる。
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: このコミットの CI を見る
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 注釈付きタグでも、この API はタグが指すコミットの SHA を返す。
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          echo "release のコミット: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # **main に入っているコミットか。** 入っていなければ、PR の途中の
          # コミットにタグを打ったということ。
          git fetch --quiet origin main
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$TAG は main に入っていない"; exit 1; }

          # **main への push で走った CI だけを見る。**
          # PR の CI はブラウザテストが skip され、それでも全体は success に
          # なるので、これを許すと画面の確認を一度も通さずに本番へ出せる。
          runs=$(gh api "repos/$REPO/actions/runs?head_sha=$sha&per_page=100" \
                 --jq '[.workflow_runs[]
                        | select(.name == "CI" and .event == "push"
                                 and .head_branch == "main")]')
          if [ "$(echo "$runs" | jq 'length')" = "0" ]; then
            echo "::error::このコミットで main の CI が走っていない"
            exit 1
          fi
          status=$(echo "$runs" | jq -r '.[0].status')
          conclusion=$(echo "$runs" | jq -r '.[0].conclusion')
          echo "CI: status=$status conclusion=$conclusion"
          test "$status" = "completed" || { echo "::error::CI がまだ終わっていない"; exit 1; }
          test "$conclusion" = "success" || { echo "::error::CI が通っていない"; exit 1; }

          # ブラウザテストが本当に走ったか。skip のまま素通りさせない。
          run_id=$(echo "$runs" | jq -r '.[0].id')
          browser=$(gh api "repos/$REPO/actions/runs/$run_id/jobs" \
                    --jq '[.jobs[] | select(.name | startswith("ブラウザ"))] | .[0].conclusion')
          echo "ブラウザテスト: $browser"
          test "$browser" = "success" \
            || { echo "::error::ブラウザテストが通っていない ($browser)"; exit 1; }

  deploy:
    name: 本番へ出す
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # guard が確かめた**そのコミット**を出す。タグは動かせるので、
          # 名前で取り直すと確認したものと別物が出かねない。
          ref: ${{ needs.guard.outputs.sha }}

      - name: Vercel へ出す（Production）
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: "59.25.4"
        run: |
          set -euo pipefail
          # staging と同じ理由で `--prebuilt` は使わない。
          npx --yes vercel@$VERCEL_CLI_VERSION deploy --prod --token "$VERCEL_TOKEN" > deploy.out
          # staging と同じ理由で、出力の形が変わっても取れるようにする。
          url=$(jq -er '.deployment.url' < deploy.out 2>/dev/null || true)
          # `|| true` が要る。`set -e` 下では、grep が見つけられないと
          # **この行で落ちて**、下の `::error::` も `cat` も出ない。
          [ -n "$url" ] || url=$(grep -oE '[A-Za-z0-9.-]+\.vercel\.app' deploy.out | tail -1 || true)
          # JSON はスキーム付き、平文はホスト名だけのことがある。形を揃える。
          [ -n "$url" ] && url="https://${url#https://}" || true
          case "$url" in
            https://*) ;;
            *) echo "::error::デプロイ先の URL を取れなかった"; cat deploy.out; exit 1 ;;
          esac
          echo "production: $url"
          echo "production: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 出たものが応答するか
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_DOMAIN }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # **確認を飛ばさない。** `PRODUCTION_DOMAIN` が未設定でも、いま出した
          # デプロイの URL は分かっている。本番を一度も確かめずに緑にするのは、
          # いちばん確かめたい回（最初のリリース）を素通りさせることになる。
          if [ -n "$PRODUCTION_URL" ]; then
            base="https://$PRODUCTION_URL"
          else
            base="$DEPLOYED_URL"
            echo "::warning::PRODUCTION_DOMAIN が未設定。出したデプロイの URL で確かめる"
          fi
          test -n "$base" || { echo "::error::確かめる先が分からない"; exit 1; }
          echo "確認先: $base"

          # 1. 起動しているか
          for i in $(seq 1 20); do
            curl -sf "$base/api/health" > /dev/null && break
            sleep 5
          done
          test "$(curl -s "$base/api/health")" = '{"status":"ok"}'

          # 2. **DB に届いているか。** health は DB に触らないので、
          #    接続文字列が違っても移行を流し忘れても 200 が返ってしまう。
          #    存在しない練習会を引く経路なら、合言葉なしで SELECT を1回通せる。
          #    404 が返れば DB に届いてテーブルもある。500 なら届いていない。
          # **中身まで見る。** 静的ファイルが `/` に mount されているので、
          # 経路が消えたときも 404 になる（本文は `{"detail":"Not Found"}`）。
          # ここで見たいのは「練習会を探しに DB まで行った」ことなので、
          # アプリが返す `code` を確かめる。
          body=$(curl -s "$base/api/sessions/zzzzzzzzzz/current")
          if echo "$body" | jq -e '.code == "not_found"' > /dev/null 2>&1; then
            echo "DB まで届いている"
          else
            echo "::error::DB に届いていない。接続文字列と移行を確認すること"
            echo "返ってきたもの: $body"
            exit 1
          fi

          # 3. 合言葉の門が開いていないか
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/api/sessions")
          test "$code" = "401" || { echo "::error::合言葉なしで通る（$code）"; exit 1; }

          # 4. メンバー用画面が配られているか（QR の行き先）
          curl -sf "$base/member.html" > /dev/null
          echo "本番の確認 OK"
